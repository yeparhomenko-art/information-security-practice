services:
  api:
    build: .

    ports:
      - "8000:8000"

    environment:
      - DATABASE_URL=sqlite:///./data/dekanat.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

    volumes:
      - ./data:/app/data

    # Security options
    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

  nginx:
    image: nginx:alpine

    ports:
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      - api

    restart: unless-stopped















